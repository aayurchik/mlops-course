
name: hw-realtime-inference

services:
  triton:
    image: nvcr.nju.edu.cn/nvidia/tritonserver@sha256:153d3158d96346bc50df7fa6e1c3a96d6dc638249072be20ebbbcae07b8505ca
    platform: linux/amd64
    command:
      - tritonserver
      - --model-repository=/models
      - --model-control-mode=explicit
      - --load-model=${CV_MODEL}
      - --allow-gpu-metrics=true
    volumes:
      - ./model_repository:/models
    ports:
      - "8002:8002"
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai:v0.33.0
    platform: linux/amd64
    command:
      - --model
      - Qwen/Qwen2.5-1.5B-Instruct
      - --served-model-name
      - ${LLM_MODEL}
      - --gpu-memory-utilization
      - "0.55"
      - --max-model-len
      - "4096"
      - --host
      - 0.0.0.0
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf_cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  gateway:
    build: ./gateway
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      STUDENT_NAME: ${STUDENT_NAME:?STUDENT_NAME is required}
      STUDENT_EMAIL: ${STUDENT_EMAIL:?STUDENT_EMAIL is required}
      CV_MODEL: ${CV_MODEL:?CV_MODEL is required}
      LLM_MODEL: ${LLM_MODEL:?LLM_MODEL is required}
      GPU_NAME: ${GPU_NAME:-}
      TRITON_URL: http://triton:8000
      VLLM_URL: http://vllm:8000
      TRITON_METRICS_URL: http://triton:8002/metrics
      VLLM_METRICS_URL: http://vllm:8000/metrics
      NODE_METRICS_URL: http://node-exporter:9100/metrics
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      - triton
      - vllm
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.1
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
    restart: unless-stopped

volumes:
  hf_cache:
  prometheus_data:
